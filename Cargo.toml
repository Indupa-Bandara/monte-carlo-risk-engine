[package]
name = "risk-engine"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
clap = { version = "4.6.8", features = ["derive"] }
csv = "1.3"
parquet = { version = "60.1.0", features = ["arrow"] }
rayon = "1.10"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cpu_backends"
harness = false
